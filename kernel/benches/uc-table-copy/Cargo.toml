[package]
name = "uc-table-copy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bench-utils = { path = "../bench-utils" }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
object_store = "0.12.3"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros"] }
uc-client = { path = "../../../uc-client" }
url = "2"

# for cargo-release
[package.metadata.release]
release = false
